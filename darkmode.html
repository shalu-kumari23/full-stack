<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Theme Toggle</title>

<style>
body{
  font-family: Verdana, Geneva, Tahoma, sans-serif;
  background-color:#f2f6ff;
  color:#222;
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
  margin:0;
}

/* container */
.container{
  text-align:center;
  padding:40px;
  border:1px solid #ddd;
  border-radius:10px;
  background:white;
}

/* dark theme */
body.dark{
  background-color:#0b0f19;
  color:#eaeaea;
}

body.dark .container{
  background:#161b29;
  border-color:#333;
}

/* heading */
h1{
  font-size:2rem;
  margin-bottom:10px;
}

/* paragraph */
p{
  font-size:0.95rem;
}

/* button style */
button{
  margin-top:20px;
  padding:10px 22px;
  border:2px solid #4a6cf7;
  background:none;
  color:#4a6cf7;
  font-weight:bold;
  border-radius:6px;
  cursor:pointer;
}

/* hover */
button:hover{
  background:#4a6cf7;
  color:white;
}

/* dark mode button */
body.dark button{
  border-color:#ff7a18;
  color:#ff7a18;
}

body.dark button:hover{
  background:#ff7a18;
  color:black;
}

/* localStorage display */
#lsDisplay{
  font-weight:bold;
  color:#555;
}

body.dark #lsDisplay{
  color:#bbb;
}
</style>

</head>

<body>

<div class="container">
  <h1 id="title">☀️ Light Mode</h1>
  <p>Your preference will stay saved even after refresh.</p>

  <p style="font-size:0.85rem;margin-top:10px;">
    localStorage value: <strong id="lsDisplay">null</strong>
  </p>

  <button onclick="toggleMode()">Change Theme</button>
</div>

<script>

// check saved theme
const saved = localStorage.getItem('theme');
if(saved === 'dark'){
  applyDark();
}

updateDisplay();

function toggleMode(){
  if(document.body.classList.contains('dark')){
    applyLight();
    localStorage.setItem('theme','light');
  }else{
    applyDark();
    localStorage.setItem('theme','dark');
  }
  updateDisplay();
}

function applyDark(){
  document.body.classList.add('dark');
  document.getElementById('title').textContent = "🌙 Dark Mode";
}

function applyLight(){
  document.body.classList.remove('dark');
  document.getElementById('title').textContent = "☀️ Light Mode";
}

function updateDisplay(){
  document.getElementById('lsDisplay').textContent = localStorage.getItem('theme');
}

</script>

</body>
</html>
