<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Weather Dashboard</title>

<style>

body{
font-family: Arial;
background:#eef2ff;
text-align:center;
}

h1{
margin-top:20px;
}

.container{
display:flex;
justify-content:center;
gap:20px;
margin-top:30px;
flex-wrap:wrap;
}

.card{
background:white;
padding:20px;
width:200px;
border-radius:10px;
box-shadow:0 4px 10px rgba(0,0,0,0.1);
}

.temp{
font-size:28px;
font-weight:bold;
}

.emoji{
font-size:40px;
}

#loading{
font-size:18px;
margin-top:20px;
}

#error{
color:red;
margin-top:20px;
}

</style>
</head>

<body>

<h1>Weather Dashboard</h1>

<div id="loading">Loading weather...</div>
<div id="error"></div>

<div class="container" id="weatherContainer"></div>

<script>

const cities = ["Delhi","Mumbai","Bangalore"];

function getWeatherEmoji(code){
if(code == 0) return "☀️";
if(code <= 3) return "⛅";
if(code <= 48) return "🌫️";
if(code <= 67) return "🌧️";
if(code <= 77) return "❄️";
if(code <= 82) return "🌧️";
if(code <= 95) return "⛈️";
return "🌤️";
}

async function fetchCityWeather(city){

// 1 Geocoding API
const geoRes = await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${city}`);
const geoData = await geoRes.json();

if(!geoData.results){
throw new Error("City not found");
}

const lat = geoData.results[0].latitude;
const lon = geoData.results[0].longitude;

// 2 Weather API
const weatherRes = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current_weather=true`);
const weatherData = await weatherRes.json();

return {
city: city,
temp: weatherData.current_weather.temperature,
code: weatherData.current_weather.weathercode
};

}

async function loadWeather(){

try{

const weatherPromises = cities.map(city => fetchCityWeather(city));

const results = await Promise.all(weatherPromises);

document.getElementById("loading").style.display="none";

const container = document.getElementById("weatherContainer");

results.forEach(data=>{

const card = document.createElement("div");
card.className="card";

const emoji = getWeatherEmoji(data.code);

card.innerHTML=`
<h2>${data.city}</h2>
<div class="emoji">${emoji}</div>
<div class="temp">${data.temp}°C</div>
`;

container.appendChild(card);

});

}catch(err){

document.getElementById("loading").style.display="none";
document.getElementById("error").innerText="Failed to load weather data";

}

}

loadWeather();

</script>

</body>
</html>
